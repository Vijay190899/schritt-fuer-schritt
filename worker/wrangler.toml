name = "lumikuttan"
main = "index.js"
compatibility_date = "2024-11-01"

# Cloudflare Workers AI binding. This is what runs the open-source LLM.
# No API key needed.
[ai]
binding = "AI"

# The Worker already tries current models in order and falls back automatically.
# To force one specific model, uncomment and redeploy:
#   [vars]
#   MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"   # higher quality
#   MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"        # fast / cheap (default)
